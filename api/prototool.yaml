protoc:
  version: 3.8.0
  includes:
    - /googleapis
lint:
  group: google
generate:
  go_options:
    import_path: github.com/aunum/sphere/api
  plugins:
    - name: go
      type: go
      flags: plugins=grpc,paths=source_relative
      output: ./gen/go/v1alpha
    - name: grpc-gateway
      type: go
      flags: paths=source_relative
      output: ./gen/go/v1alpha
    - name: swagger
      flags: json_names_for_fields=true
      output: ./v1alpha
    - name: python
      output: ./gen/python/v1alpha
